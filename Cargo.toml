[package]
name = "qarray_rust_core"
version = "1.3.1"
edition = "2021"

[lib]
name = "qarray_rust_core"
crate-type = ["cdylib"]

[dependencies]
osqp = "1.0.0"
ndarray = "0.16.1"
numpy = "0.26"
rayon = "1.10.0"
pyo3 = { version = "0.26", features = ["extension-module"] }

[profile.release]
codegen-units = 1
lto = true
